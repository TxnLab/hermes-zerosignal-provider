name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the pinned hermes-agent commit
        # Single source of truth: [tool.hermes-zerosignal-provider].hermes_ref in pyproject.toml.
        run: |
          set -euo pipefail
          ref="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["hermes-zerosignal-provider"]["hermes_ref"])')"
          echo "HERMES_REF=${ref}" >> "$GITHUB_ENV"
          echo "hermes-agent @ ${ref}"

      - name: Install pinned hermes-agent (editable) and dev deps
        # hermes-agent's setup.py refuses to build a wheel outside Nix, so a plain
        # `pip install git+...` fails; an editable install from a checkout at the pinned
        # commit is the supported route.
        run: |
          set -euo pipefail
          git init -q hermes-agent-src
          git -C hermes-agent-src fetch -q --depth 1 https://github.com/NousResearch/hermes-agent "${HERMES_REF}"
          git -C hermes-agent-src checkout -q FETCH_HEAD
          python -m pip install --upgrade pip
          pip install -e ./hermes-agent-src
          pip install -e ".[dev]"

      - name: hermes plugins validate
        # The same admission check the Hermes plugin-catalog CI runs against a candidate entry.
        run: hermes plugins validate .

      - name: Tests
        run: python -m pytest -q
