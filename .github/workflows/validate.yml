name: validate

on:
  push:
    branches: [main]
  pull_request:

# The job runs code it does not control (Hermes and its whole locked dependency tree), and the
# repo default token can write. Nothing here needs more than a read, so nothing else is granted.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason: the token is not left in .git/config for that code to find.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # The pinned Hermes declares its dependencies for 3.14 only, and its uv.lock
          # resolves nowhere else.
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Read the pinned hermes-agent commit
        # Single source of truth: [tool.hermes-zerosignal-provider].hermes_ref in pyproject.toml.
        run: |
          set -euo pipefail
          ref="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["hermes-zerosignal-provider"]["hermes_ref"])')"
          echo "HERMES_REF=${ref}" >> "$GITHUB_ENV"
          echo "hermes-agent @ ${ref}"

      - name: Install pinned hermes-agent (editable) and dev deps
        # hermes-agent's setup.py refuses to build a wheel outside Nix, so a plain
        # `pip install git+...` fails. Its locked environment is the supported route: a
        # checkout at the pinned commit, `uv sync --frozen`, then the plugin's dev tools
        # into that same venv. (`pip install -e` of the checkout no longer resolves.) The
        # checkout lives outside the plugin directory: `hermes plugins validate .` scans every
        # file under it, and Hermes' own sources fail the plugin isolation checks.
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/hermes-agent-src"
          git init -q "${src}"
          git -C "${src}" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent "${HERMES_REF}"
          git -C "${src}" checkout -q FETCH_HEAD
          (cd "${src}" && uv sync --frozen --python "$(command -v python)")
          uv pip install --python "${src}/.venv/bin/python" -e ".[dev]"
          echo "${src}/.venv/bin" >> "$GITHUB_PATH"

      - name: hermes plugins validate
        # The same admission check the Hermes plugin-catalog CI runs against a candidate entry.
        run: hermes plugins validate .

      - name: Tests
        run: python -m pytest -q
